name: Build and core test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check portable runtime and install plans
        shell: pwsh
        run: |
          node --test runtime/gateway/test-*.mjs runtime/worker/test-*.mjs
          if ($LASTEXITCODE -ne 0) { throw "Runtime tests failed" }
          & ./setup/setup-tests.ps1
          & ./setup/backend-tests.ps1
          & ./setup/strata-tests.ps1
          & ./setup/strata-attach-tests.ps1
          python ./setup/backend-prepare-tests.py
          if ($LASTEXITCODE -ne 0) { throw "Backend preparation tests failed" }
      - name: Build Windows app
        shell: cmd
        run: build.cmd
      - name: Check state and usage logic
        shell: pwsh
        run: |
          & ./setup/app-tests.ps1 -ResultsDirectory (Join-Path $env:RUNNER_TEMP ('qwen-app-tests-'+[guid]::NewGuid().ToString('N')))
      - name: Upload offline UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ui-previews
          path: |
            ${{ runner.temp }}/qwen-app-tests-*/*.png
            ${{ runner.temp }}/qwen-app-tests-*/*.txt
          if-no-files-found: error
