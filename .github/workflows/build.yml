name: Build and core test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check portable runtime and install plans
        shell: pwsh
        run: |
          node --test runtime/gateway/test-*.mjs runtime/worker/test-*.mjs
          if ($LASTEXITCODE -ne 0) { throw "Runtime tests failed" }
          & ./setup/setup-tests.ps1
          & ./setup/backend-tests.ps1
          python ./setup/backend-prepare-tests.py
          if ($LASTEXITCODE -ne 0) { throw "Backend preparation tests failed" }
      - name: Build Windows app
        shell: cmd
        run: build.cmd
      - name: Check state and usage logic
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--core-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Core test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\core-test-result.txt') -Raw
          if ($result.Trim() -ne 'PASS') { throw "Core test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--insights-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Insights test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\insights-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Insights test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--operations-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Operations test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\operations-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Operations test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--experience-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Experience test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\experience-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Experience test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--chat-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Chat test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\chat-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Chat test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--delegation-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Delegation test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\delegation-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Delegation test result: $result" }
          $process = Start-Process -FilePath .\QwenStatus.new.exe -ArgumentList '--install-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'QwenStatus\install-test.txt') -Raw
          if (-not $result.StartsWith('PASS:')) { throw "Installer test result: $result" }
